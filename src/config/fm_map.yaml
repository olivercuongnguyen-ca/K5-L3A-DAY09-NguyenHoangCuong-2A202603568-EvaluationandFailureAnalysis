# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket claims override DB facts
stale_policy: FM-06            # superseded / not-yet-effective clause
clause_sum: FM-04              # clauses summed instead of the largest
double_deduct: FM-05           # prior refund deducted before the host deducts it again
sibling_refund: FM-07          # refund written under a sibling claim
denied_ignored: FM-02          # host denied (expired / spent approval), agent still reports success
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # another principal's order or PII
